{{ partial "header.html" . }}
    <h1>{{ .Title }}</h1>
    <ul>
    {{ range .RegularPages }}
        <li>
            {{ if .Date }}<small>{{ .Date | time.Format ":date_long" }}</small>{{ end }}
            <h2><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
            <p>{{ .Summary | plainify }}... <a href="{{ .RelPermalink }}">Leer más</a></p>
        </li>
    {{ end }}
    </ul>
{{ partial "footer.html" . }}
